[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qa-agent"
version = "0.1.0"
description = "Autonomous AI testing agent powered by Claude and Playwright"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "litellm>=1.55.0",
    "json-repair>=0.30.0",
    "playwright>=1.49.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "rich>=13.9.0",
    "click>=8.1.0",
    "pydantic-settings>=2.6.0",
    "tenacity>=9.0.0",
]

[project.scripts]
qa-agent = "qa_agent.cli:cli"
qa-agent-api = "qa_agent.api.__main__:main"

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "sse-starlette>=2.1.0",
    "cryptography>=43.0.0",
    "pyjwt[crypto]>=2.9.0",
    "slowapi>=0.1.9",
]
# Optional production observability — guarded imports, no-op when unset.
observability = [
    "sentry-sdk[fastapi]>=2.18.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-playwright>=0.6.0",
    "httpx>=0.27.0",
    "asgi-lifespan>=2.1.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest-cov>=6.0.0",
    "respx>=0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qa_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]
addopts = "--cov=qa_agent --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    # B008: FastAPI/Click idioms call functions in argument defaults (Depends()).
    "B008",
    # UP042: migrating Enum -> StrEnum changes serialization semantics; out of scope.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Prompt strings are long-form prose; wrapping them hurts readability.
"src/qa_agent/prompts.py" = ["E501"]
# Test fixtures and assertions often carry long literal lines on purpose.
"tests/*" = ["E501"]
"demo/*" = ["E501"]
# Auto-generated migration scripts; not hand-maintained for line width.
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
ignore_missing_imports = true
# Pragmatic start: the suite is large and dynamic in places. Tighten over time.
warn_unused_ignores = false

# The browser-glue modules drive Playwright's async API dynamically (pages are
# threaded through as loosely-typed handles, and Playwright's storage_state
# stubs are stricter than our dict usage). They're incrementally adopted into
# mypy; the API/store/models core below is fully checked. Relax error codes
# here rather than scattering per-line ignores through working code.
[[tool.mypy.overrides]]
module = [
    "qa_agent.explorer",
    "qa_agent.crawler",
    "qa_agent.healer",
    "qa_agent.executor",
]
disable_error_code = ["arg-type", "attr-defined", "union-attr", "return-value"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-playwright>=0.6.0",
    "httpx>=0.27.0",
    "asgi-lifespan>=2.1.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest-cov>=6.0.0",
    "respx>=0.21.0",
]
